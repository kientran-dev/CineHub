spring.application.name=CineHub

# Database Configuration PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.npzpnugrqdgymtbvyhlj.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (access: 15m and refresh: 7d)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# VNPay Configuration
vnpay.tmn-code=${VNP_TMN_CODE:9YMSZ2D2}
vnpay.hash-secret=${VNP_HASH_SECRET}
vnpay.api-url=${VNP_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNP_RETURN_URL:https://api.cinehub.software/api/v1/payments/vnpay-return}
vnpay.frontend-redirect-url=${VNP_FRONTEND_REDIRECT_URL:https://cinehub.software/profile}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.message-converters.preferred-json-mapper=jackson
server.tomcat.max-http-form-post-size=10MB
spring.codec.max-in-memory-size=10MB

# Gmail SMTP Configuration
spring.mail.host=smtp.googlemail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth Client ID
google.client-id=${GOOGLE_CLIENT_ID}

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.kientran.cinehub=INFO

# Disable Mail Healthcheck (avoid app marked DOWN if SMTP credentials are placeholder/invalid)
management.health.mail.enabled=false

# ─────────────────────────────────────────────
# Redis Cache Configuration
# ─────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis

# ─────────────────────────────────────────────
# Actuator & Prometheus Metrics Configuration
# ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
